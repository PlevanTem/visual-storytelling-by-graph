name: Validate skill and fixed exhibits
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check committed data, SVG encodings and evidence hashes
        run: python scripts/validate_bundle.py
      - name: Check gallery JavaScript syntax
        run: node --check docs/app.js
